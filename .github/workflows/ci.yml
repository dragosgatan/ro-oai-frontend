name: Public pull request checks

on:
    pull_request:
        branches:
            - main
        types:
            - opened
            - synchronize
            - reopened
            - edited
    push:
        branches:
            - main
    merge_group:

permissions:
    contents: read

concurrency:
    group: public-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
            NEXT_PUBLIC_SITE_URL: http://localhost:3000
            NEXT_PUBLIC_APP_URL: http://localhost:3000
            NEXT_PUBLIC_CONTACT_EMAIL: contact@example.invalid
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: frontend
            NEXT_PUBLIC_KEYCLOAK_ISSUER: http://localhost:8081/realms/example
            KEYCLOAK_CLIENT_SECRET: public-ci-placeholder
            NEXTAUTH_URL: http://localhost:3000
            NEXTAUTH_SECRET: public-ci-placeholder

        steps:
            - name: Check out source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false

            - name: Install pinned Gitleaks
              shell: bash
              run: |
                  set -euo pipefail
                  archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
                  curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
                    --output "$archive" \
                    'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
                  echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$archive" \
                    | sha256sum --check --strict
                  tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
                  chmod 0755 "$RUNNER_TEMP/gitleaks"
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

            - name: Scan the complete public tree for secrets
              run: gitleaks dir --redact=100 --no-banner .

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 24
                  cache: npm

            - name: Validate public repository policy
              run: node scripts/validate-public-repository.mjs

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npm run build
